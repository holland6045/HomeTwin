# HomeTwin configuration.
# World frame: meters, z up, origin at a chosen apartment corner.

world:
  # optional Gaussian-splat scan (.ply/.splat): the dashboard's 3D tab
  # renders live item markers, trails, and sensor overlays inside it.
  # Calibrate camera poses from the same scan with:
  #   hometwin calibrate-cameras --colmap <dir> --pairs refpoints.yaml
  # See docs/gaussian-splatting.md.
  # splat_asset: scans/apartment.ply
  # splat_transform: {position: [0, 0, 0], rotation_deg: [0, 0, 0], scale: 1.0}
  # Blocky calibration targets (printed ArUco, surveyed once): a shared
  # fixed reference for every camera that sees one. Optional — cameras run
  # on configured poses alone. Generate: hometwin make-anchor --id 100
  # anchors:
  #   - {tag: "aruco:100", position: [6.9, 1.5, 0.9]}   # kitchen counter
  #   - {tag: "aruco:101", position: [0.3, 2.0, 1.4]}   # hallway wall
  # Spots: drawer/shelf-level micro-locations. Resolution prefers a spot
  # over its zone ("desk-drawer-2", not just "office"). A tagged spot's
  # surveyed position also calibrates cameras (anchor for free). Print the
  # label with: hometwin make-tag --id 13 --ident DRW/02 --caption "desk drawer 2"
  # spots:
  #   - {name: desk-drawer-2, tag: "aruco:13", position: [1.0, 1.0, 0.6], radius: 0.2}
  #   - {name: shelf-b3,      tag: "aruco:14", position: [3.5, 0.2, 1.6], radius: 0.3}
  # Tags on moving surfaces (doors, drawers): one-DOF motion models turn
  # them into open/closed sensors. Never used for calibration. With `spot`
  # linked, "keys last seen at the open drawer, drawer closed, keys gone"
  # becomes "keys: likely inside utensil-drawer".
  # movables:
  #   - name: utensil-drawer
  #     tag: "aruco:40"
  #     motion: slide
  #     home: [6.7, 1.55, 0.72]    # tag position fully closed
  #     axis: [0, 1, 0]            # opening direction
  #     travel: 0.35               # metres of extension
  #     spot: utensil-drawer
  #   - name: closet-door
  #     tag: "aruco:41"
  #     motion: hinge
  #     home: [3.0, 0.05, 1.2]     # tag position closed
  #     hinge: [2.6, 0.05]         # vertical hinge line (x, y)
  #     max_angle_deg: 110
  zones:
    - {name: living_room,     min: [0, 0, 0],        max: [5, 4, 2.6]}
    - {name: kitchen,         min: [5, 0, 0],        max: [8, 4, 2.6]}
    - {name: kitchen_counter, min: [6, 0.5, 0.8],    max: [7.5, 1.5, 1.1]}
    - {name: entry_table,     min: [0, 0, 0.7],      max: [1, 0.6, 1.0]}
    - {name: sofa,            min: [1.5, 2.8, 0.3],  max: [3.0, 3.8, 0.7]}

items:
  - id: keys
    name: House keys
    labels: [keys]           # anonymous detector classes that may be these keys
    tags: ["aruco:7"]        # identifying tags: aruco:<id>, ble:<MAC>, rfid:<EPC>
  - id: wallet
    name: Wallet
    tags: ["ble:AA:11:22:33:44:55"]
  - id: phone
    name: Phone
    labels: [cell phone]
    tags: ["ble:BB:66:77:88:99:00"]

# Families of visually identical items (storage boxes) distinguished only by
# sequential tags: box-01..box-12 carrying aruco:20..31. The shared label lets
# anonymous "storage box" detections refine whichever box is already tracked
# nearby — never seed or hijack one.
# item_sets:
#   - id_prefix: box-
#     count: 12
#     first_tag_id: 20
#     labels: [storage box]

sensors:
  # USB webcam (or ESP32-CAM MJPEG URL) + ArUco detection, projected onto
  # the kitchen counter plane.
  - type: camera
    id: cam-kitchen
    position: [7.5, 3.8, 2.3]
    yaw_deg: -110
    pitch_deg: 40
    hfov_deg: 80
    surface_z: 0.9
    source: {type: opencv, device: 0}
    detector: {type: aruco, dictionary: DICT_4X4_250}
    # browser-loadable stream for the dashboard's camera-overlay view
    # stream_url: "http://192.168.1.40/mjpeg"
    # fold anchor residuals back into this camera's pose (default: report only)
    # anchor_correct: true

  # Same camera hardware, different brains: an ONNX model fine-tuned on your
  # items via `hometwin train detector_finetune`.
  # - type: camera
  #   id: cam-living
  #   position: [0.2, 0.2, 2.4]
  #   yaw_deg: 45
  #   pitch_deg: 35
  #   surface_z: 0.0
  #   source: {type: opencv, device: "http://192.168.1.40/mjpeg"}
  #   detector: {type: onnx, model_path: models/my_items.onnx, labels: [keys, wallet, cell phone]}

  # COCO-class detection with RT-DETRv2 (Apache-2.0, NMS-free): person,
  # cell phone, backpack, laptop... out of the box. Export weights once
  # with scripts/export_rtdetr.sh. "person" detections feed motion zones
  # (tracker.presence_labels), so a webcam alone drives the synthetic
  # PIRs below — no RF mesh needed.
  # - type: camera
  #   id: cam-entry
  #   position: [0.2, 3.8, 2.3]
  #   yaw_deg: -45
  #   pitch_deg: 35
  #   surface_z: 0.0
  #   source: {type: opencv, device: 0}
  #   detector: {type: rtdetr, model_path: rtdetr_onnx/model.onnx}

  # Multi-camera 3D: overlapping cameras in ray mode emit sight rays that
  # the fusion engine triangulates — no surface assumption, tracks items in
  # motion. One viewpoint alone falls back to an item-height depth prior.
  # - type: camera
  #   id: cam-living-a
  #   position: [0.0, 0.0, 2.4]
  #   yaw_deg: 50
  #   pitch_deg: 25
  #   mode: ray
  #   bearing_sigma_rad: 0.02
  #   source: {type: opencv, device: "http://192.168.1.41/mjpeg"}
  #   detector: {type: onnx, model_path: models/my_items.onnx, labels: [keys, wallet, cell phone]}
  # - type: camera
  #   id: cam-living-b
  #   position: [5.0, 4.0, 2.4]
  #   yaw_deg: -130
  #   pitch_deg: 25
  #   mode: ray
  #   source: {type: opencv, device: "http://192.168.1.42/mjpeg"}
  #   detector: {type: onnx, model_path: models/my_items.onnx, labels: [keys, wallet, cell phone]}

  # JSON-lines TCP ingest for MCU nodes (ESP32 BLE scanners, RTI link meshes,
  # anything). Raw "rssi" messages are converted with this path-loss model;
  # retrain it with: hometwin train path_loss
  # BLE scanner with a printed tag ON the device: cameras triangulate it,
  # refining the hand-measured anchor position every range depends on.
  # - type: ble_scanner
  #   id: ble-hall
  #   position: [0.0, 4.0, 2.2]      # rough survey; cameras refine it
  #   device_tag: "aruco:50"
  #   device_tag_correct: true

  - type: network_bridge
    id: bridge
    port: 8787
    tx_power: -59.0
    exponent: 2.7
    # nodes must send {"auth": "<token>"} as their first line (one check per
    # connection — no per-message cost). Omit only on a trusted IoT VLAN.
    # auth_token: "change-me-bridge-secret"

# Expose presence as Home Assistant motion sensors: draw zones (or
# shift-drag them on the dashboard map) and each becomes its own HA device
# via MQTT discovery. docs/home-assistant.md
# home_assistant:
#   mqtt: {host: 192.168.1.5, port: 1883}
#   off_delay_s: 30
# motion_zones:
#   - {name: living-room-motion, min: [0, 0, 0], max: [5, 4, 2.6]}
#   - {name: hallway-motion, center: [6.0, 2.0], radius: 1.2}

tracker:
  poll_hz: 10
  stale_after_s: 300
  dataset_dir: dataset
  state_path: tracker_state.json   # last-known locations survive restarts
  save_interval_s: 30
  # Detector classes treated as occupants, not items. They are tracked
  # through the fusion engine in a separate people registry (smoothed
  # position + velocity, multi-person association) and drive motion zones,
  # the "People" overlay, and relocation inference — never an item track.
  presence_labels: [person]
  presence_stale_after_s: 12   # an occupant unseen this long is dropped
  # Relocation inference: if a person is within reach of an item and the
  # item then goes quiet (tag pocketed / object hidden in hand), it is
  # presumed carried; its likely location follows that person until they
  # settle or leave. Surfaces as `maybe_carried_by`/`likely_zone` on the
  # item and in `hometwin where <item>`. Generalizes the drawer-stow guess.

api:
  host: 127.0.0.1
  port: 8080
  # Bearer-token auth: viewer = read-only (dashboards), admin = read+write
  # (tagging, splat upload). Without tokens, reads are open and writes are
  # loopback-only. Secrets come from env/file — never commit literals.
  # auth:
  #   tokens:
  #     - {env: TRACKER_ADMIN_TOKEN, role: admin}
  #     - {file: /etc/hometwin/viewer.token, role: viewer}
