# First run on a PC with its webcam — minimal single-camera twin.
#
#   pip install -e .[vision]
#   hometwin make-anchor --id 7 -o tag-keys.png     # print, tape to your keys
#   hometwin webcam-test                            # smoke test: see detections
#   hometwin make-board -o board.svg                # print at 100%, lay flat
#   hometwin webcam-setup --board
#       -> prints this camera block with the measured pose; paste it below
#       (single-marker fallback: make-anchor --id 100 + webcam-setup --marker-mm N)
#   hometwin run -c configs/webcam-quickstart.yaml  # then open http://127.0.0.1:8080/
#   hometwin where keys
#
# The flat marker IS the world origin (top edge = +y axis): no tape measure.
# The pose below is only a fallback if you skip webcam-setup.

world:
  zones:
    - {name: desk-area, min: [0, 0, 0], max: [3, 3, 2.6]}

items:
  - id: keys
    name: House keys
    tags: ["aruco:7"]
  - id: wallet
    name: Wallet
    tags: ["aruco:8"]

sensors:
  - type: camera
    id: webcam
    # webcam on top of the monitor, looking down at the desk: ~0.45 m up,
    # pitched down ~35 deg. Eyeball it; anchor tags can self-correct later.
    position: [1.5, 0.0, 0.45]
    yaw_deg: 90          # facing +y (into the desk)
    pitch_deg: 35
    hfov_deg: 70
    surface_z: 0.0       # detections assumed on the desk plane (origin z)
    base_sigma_m: 0.1
    # MJPG + explicit size: webcams default to 640x480 without it. Verify
    # the best mode for your hardware with: hometwin webcam-probe
    source: {type: opencv, device: 0, width: 1920, height: 1080, fps: 30, fourcc: MJPG}
    detector: {type: aruco, dictionary: DICT_4X4_250}

tracker:
  poll_hz: 10
  state_path: hometwin_state.json

api:
  host: 127.0.0.1
  port: 8080
