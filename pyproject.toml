[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apartment-tracker"
version = "0.1.0"
description = "Modular, hardware-agnostic CV + sensor-fusion system for locating tagged items in an apartment"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
vision = ["opencv-contrib-python>=4.8", "numpy>=1.24"]
ml = ["onnxruntime>=1.16", "numpy>=1.24"]
dev = ["pytest>=7.0"]

[project.scripts]
apartment-tracker = "apartment_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["apartment_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
