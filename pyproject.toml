[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hometwin"
version = "0.1.0"
description = "HomeTwin: a sensor-fused digital twin of your apartment — locate tagged items, presence, and door/drawer state in real time"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
vision = ["opencv-contrib-python>=4.8", "numpy>=1.24"]
ml = ["onnxruntime>=1.16", "numpy>=1.24"]
# NVIDIA GPU inference (the NUC + 4060 Ti coordinator): CUDA/TensorRT
# providers are auto-selected by hometwin.accel when this is installed
ml-cuda = ["onnxruntime-gpu>=1.16", "numpy>=1.24"]
dev = ["pytest>=7.0"]

[project.scripts]
hometwin = "hometwin.cli:main"

[tool.setuptools.packages.find]
include = ["hometwin*"]

[tool.setuptools.package-data]
hometwin = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
