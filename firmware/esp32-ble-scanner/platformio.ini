; Reference hometwin MCU node: BLE scanner -> network bridge.
; Per-node identity and anchor position are build flags; Wi-Fi credentials
; come from the environment, never from source.
;
;   WIFI_SSID=home WIFI_PASS=secret pio run -e esp32-ble-scanner -t upload

[env:esp32-ble-scanner]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^1.4.1
build_flags =
    -D SENSOR_ID=\"esp32-hall\"
    -D TRACKER_HOST=\"192.168.1.10\"
    -D TRACKER_PORT=8787
    -D ANCHOR_X=0.0f
    -D ANCHOR_Y=4.0f
    -D ANCHOR_Z=2.2f
    -D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -D WIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -D BRIDGE_TOKEN=\"${sysenv.BRIDGE_TOKEN}\"
