<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeTwin</title>
<style>
  :root { --bg:#14171c; --panel:#1d2128; --fg:#d9dee7; --dim:#7d8696; --accent:#4ea1ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px; background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 16px 0 0; font-weight:600; }
  .tabs button, .layers label { background:none; border:1px solid #333a45; color:var(--fg);
    padding:4px 10px; border-radius:6px; cursor:pointer; font-size:13px; }
  .tabs button.active { border-color:var(--accent); color:var(--accent); }
  .layers { display:flex; gap:8px; flex-wrap:wrap; }
  .layers label { display:flex; align-items:center; gap:5px; user-select:none; }
  main { display:flex; gap:12px; padding:12px; flex-wrap:wrap; }
  #view-wrap { position:relative; flex:1 1 640px; min-width:480px; background:#0b0d10;
    border-radius:8px; overflow:hidden; aspect-ratio:4/3; }
  #stream { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; }
  #canvas { position:absolute; inset:0; width:100%; height:100%; }
  #splat-wrap { display:none; position:absolute; inset:0; }
  aside { flex:0 0 300px; display:flex; flex-direction:column; gap:12px; }
  .card { background:var(--panel); border-radius:8px; padding:12px; }
  .card h2 { margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
  .item-row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #262c35; }
  .item-row:last-child { border:none; }
  .zone-name { color:var(--accent); }
  .stale { color:#e0a23c; } .never { color:var(--dim); }
  .ev { color:var(--dim); font-size:12px; padding:2px 0; }
  #gear { margin-left:auto; background:none; border:1px solid #333a45; color:var(--fg);
    padding:4px 10px; border-radius:6px; cursor:pointer; font-size:14px; }
  #settings { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55);
    z-index:10; align-items:center; justify-content:center; }
  #settings-card { width:460px; max-height:82vh; overflow:auto; }
  #settings input, #settings select { background:#0b0d10; color:var(--fg);
    border:1px solid #333a45; border-radius:4px; padding:3px 6px; width:64px; }
  #settings button { background:none; border:1px solid #333a45; color:var(--fg);
    padding:4px 10px; border-radius:6px; cursor:pointer; font-size:13px; }
  #settings button:hover { border-color:var(--accent); color:var(--accent); }
  .cam-cfg { padding:8px 0; border-bottom:1px solid #262c35; }
  .cam-cfg .now { color:var(--dim); font-size:12px; margin:2px 0 6px; }
  .cam-cfg .fields { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; }
  .cam-cfg label { display:flex; flex-direction:column; gap:2px; font-size:11px; color:var(--dim); }
  .sysrow { display:flex; gap:8px; margin:6px 0; flex-wrap:wrap; }
  #sys-shutdown { border-color:#7a3a3a; }
</style>
</head>
<body>
<header>
  <h1>HomeTwin</h1>
  <div class="tabs" id="tabs"></div>
  <div class="layers" id="layers"></div>
  <button id="gear" title="Settings">&#9881; Settings</button>
</header>
<div id="settings">
  <div class="card" id="settings-card">
    <h2>Cameras</h2><div id="cam-config"></div>
    <h2 style="margin-top:14px">System</h2>
    <div class="sysrow">
      <button id="sys-restart">Restart</button>
      <button id="sys-update">Update &amp; restart</button>
      <button id="sys-shutdown">Shut down</button>
    </div>
    <div class="ev" id="settings-msg"></div>
  </div>
</div>
<main>
  <div id="view-wrap">
    <img id="stream" alt="" style="display:none">
    <canvas id="canvas"></canvas>
    <div id="splat-wrap"></div>
  </div>
  <aside>
    <div class="card"><h2>Items</h2><div id="item-list"></div></div>
    <div class="card"><h2>Events</h2><div id="event-list"></div></div>
    <div class="card"><a id="diag" href="/debug/bundle" download>Download diagnostics</a></div>
  </aside>
</main>
<script>
"use strict";
const LAYERS = [
  ["floorplan", "Floorplan", true],
  ["zones", "Zones", true],
  ["heat", "Tomography heat", true],
  ["rings", "BLE ranges", true],
  ["bearings", "Camera rays", true],
  ["trails", "Trails", true],
  ["anchors", "Anchors", true],
  ["spots", "Spots", true],
  ["movables", "Doors/drawers", true],
  ["worldmodel", "World model", true],
  ["motion", "Motion zones", true],
  ["items", "Items", true],
  ["people", "People", true],
  ["presence", "Presence", true],
];
const ITEM_COLORS = ["#4ea1ff", "#ff7eb6", "#66d98c", "#c9a227", "#8a7dff", "#ff9d5c"];
const state = { view: "map", cameras: [], data: null, toggles: {}, splat: false, splatVersion: null };
for (const [k, , def] of LAYERS)
  state.toggles[k] = localStorage.getItem("layer:" + k) ?? String(def);

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const stream = document.getElementById("stream");

function on(layer) { return state.toggles[layer] === "true"; }

/* ---------- auth: prompt once on 401, remember the token ---------- */
function authHeaders() {
  const t = localStorage.getItem("api_token");
  return t ? { "Authorization": "Bearer " + t } : {};
}
async function authFetch(url) {
  let r = await fetch(url, { headers: authHeaders() });
  if (r.status === 401) {
    const t = prompt("API token required:");
    if (t) {
      localStorage.setItem("api_token", t.trim());
      r = await fetch(url, { headers: authHeaders() });
    }
  }
  return r;
}
function assetUrl(path) {
  // the splat viewer fetches the URL itself and cannot set headers
  const t = localStorage.getItem("api_token");
  return t ? `${path}?token=${encodeURIComponent(t)}` : path;
}
document.getElementById("diag").href = assetUrl("/debug/bundle");
stream.onerror = () => { stream.style.display = "none"; };  // no frame yet: retry next tick
function itemColor(d, itemId) {
  const ids = (d.items || []).map(i => i.item_id);
  return ITEM_COLORS[Math.max(ids.indexOf(itemId), 0) % ITEM_COLORS.length];
}

function buildLayerToggles() {
  const el = document.getElementById("layers");
  el.innerHTML = "";
  for (const [key, label] of LAYERS) {
    const lab = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = on(key);
    cb.onchange = () => {
      state.toggles[key] = String(cb.checked);
      localStorage.setItem("layer:" + key, state.toggles[key]);
      render();
      if (state.view === "3d" && splat3d && state.data) update3D(state.data);
    };
    lab.append(cb, label);
    el.append(lab);
  }
}

function buildTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  const views = [["map", "Map"], ...state.cameras.map(c => [c, "📷 " + c]), ["3d", "🧊 3D"]];
  for (const [id, label] of views) {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = state.view === id ? "active" : "";
    b.onclick = () => { state.view = id; buildTabs(); setSplatVisible(id === "3d"); tick(); };
    el.append(b);
  }
}

function heatColor(v, alphaScale = 0.55) {
  const hue = 240 - 240 * v; // blue -> red
  return `hsla(${hue},90%,55%,${(0.15 + 0.85 * v) * alphaScale})`;
}

function worldBounds(zones) {
  let xmin = 1e9, ymin = 1e9, xmax = -1e9, ymax = -1e9;
  for (const z of zones) {
    xmin = Math.min(xmin, z.min[0]); ymin = Math.min(ymin, z.min[1]);
    xmax = Math.max(xmax, z.max[0]); ymax = Math.max(ymax, z.max[1]);
  }
  if (xmin > xmax) { xmin = 0; ymin = 0; xmax = 10; ymax = 8; }
  return { xmin, ymin, xmax, ymax };
}

/* ---------- map view ---------- */
function mapTransform(d) {
  const b = worldBounds(d.zones);
  const pad = 30;
  const sx = (canvas.width - 2 * pad) / (b.xmax - b.xmin);
  const sy = (canvas.height - 2 * pad) / (b.ymax - b.ymin);
  const s = Math.min(sx, sy);
  return p => [pad + (p[0] - b.xmin) * s, canvas.height - pad - (p[1] - b.ymin) * s, s];
}

let floorplanImg = null;
function ensureFloorplan(meta) {
  if (!meta || floorplanImg) return;
  floorplanImg = new Image();
  floorplanImg.src = assetUrl("/assets/floorplan");
}

function renderMap(d) {
  const T = mapTransform(d);
  const scale = T([0, 0])[2];

  if (on("floorplan") && d.floorplan) {
    ensureFloorplan(d.floorplan);
    if (floorplanImg && floorplanImg.complete && floorplanImg.naturalWidth) {
      const [x0, y0] = T([0, d.floorplan.height_m]);
      ctx.globalAlpha = 0.45;
      ctx.drawImage(floorplanImg, x0, y0,
                    d.floorplan.width_m * scale, d.floorplan.height_m * scale);
      ctx.globalAlpha = 1;
    }
  }

  if (on("zones")) for (const z of d.zones) {
    const [x0, y0] = T(z.min), [x1, y1] = T(z.max);
    ctx.strokeStyle = "#39414e"; ctx.lineWidth = 1;
    ctx.strokeRect(x0, y1, x1 - x0, y0 - y1);
    ctx.fillStyle = "#566073"; ctx.font = "11px system-ui";
    ctx.fillText(z.name, x0 + 4, y0 - 4);
  }

  if (on("heat")) for (const h of d.heatmaps) {
    if (!h.values) continue;
    const cell = h.cell_m;
    for (let iy = 0; iy < h.values.length; iy++)
      for (let ix = 0; ix < h.values[iy].length; ix++) {
        const v = h.values[iy][ix];
        if (v < 0.05) continue;
        const [px, py] = T([h.bounds[0] + ix * cell, h.bounds[1] + (iy + 1) * cell]);
        ctx.fillStyle = heatColor(v);
        ctx.fillRect(px, py, cell * scale + 0.5, cell * scale + 0.5);
      }
    for (const id in (h.nodes || {})) {
      const [px, py] = T(h.nodes[id]);
      ctx.fillStyle = "#8a7dff"; ctx.fillRect(px - 2, py - 2, 4, 4);
    }
  }

  if (on("rings")) for (const r of d.rings) {
    const [cx, cy] = T([r.cx, r.cy]);
    ctx.strokeStyle = "rgba(102,217,140,0.45)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, r.radius * scale, 0, 7); ctx.stroke();
    const [ax, ay] = T(r.anchor);
    ctx.fillStyle = "#66d98c"; ctx.fillRect(ax - 3, ay - 3, 6, 6);
  }

  if (on("bearings")) for (const b of (d.bearings || [])) {
    const [ox, oy] = T(b.origin);
    const [ex, ey] = T([b.origin[0] + b.direction[0] * b.length_m,
                        b.origin[1] + b.direction[1] * b.length_m]);
    ctx.strokeStyle = "rgba(201,162,39,0.6)"; ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.setLineDash([]);
  }

  if (on("trails")) for (const tr of (d.trails || [])) {
    const pts = tr.points.map(p => T(p));
    const col = itemColor(d, tr.item_id);
    for (let i = 1; i < pts.length; i++) {
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.1 + 0.55 * (i / pts.length);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(pts[i - 1][0], pts[i - 1][1]);
      ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  if (on("presence") && d.presence) {
    const [px, py] = T(d.presence.centroid);
    ctx.fillStyle = "rgba(138,125,255,0.25)";
    ctx.beginPath(); ctx.arc(px, py, d.presence.sigma_m * scale, 0, 7); ctx.fill();
    ctx.fillStyle = "#8a7dff"; ctx.fillText("presence", px + 6, py);
  }

  if (on("people")) for (const p of (d.people || [])) {
    const pts = (p.trail || []).map(q => T(q));
    for (let i = 1; i < pts.length; i++) {
      ctx.strokeStyle = "#ff5c8a";
      ctx.globalAlpha = 0.1 + 0.5 * (i / pts.length); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(pts[i - 1][0], pts[i - 1][1]);
      ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    const [px, py] = T(p.position);
    ctx.fillStyle = "#ff5c8a";
    ctx.beginPath(); ctx.arc(px, py, 6, 0, 7); ctx.fill();
    // velocity arrow
    const [ex, ey] = T([p.position[0] + p.velocity[0], p.position[1] + p.velocity[1]]);
    ctx.strokeStyle = "#ff5c8a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.fillStyle = "#ffb3c9"; ctx.fillText(p.id, px + 8, py - 6);
  }

  if (on("movables")) for (const m of (d.movables || [])) {
    const pts = m.path.map(p => T(p));
    ctx.strokeStyle = "#39414e"; ctx.lineWidth = 2;
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.stroke();
    const [tx, ty] = T(m.tag_pos);
    ctx.fillStyle = m.is_open ? "#9dff00" : "#566073";
    ctx.beginPath(); ctx.arc(tx, ty, 4, 0, 7); ctx.fill();
    ctx.fillStyle = "#7d8696"; ctx.font = "10px system-ui";
    ctx.fillText(`${m.name} ${m.is_open ? "OPEN" : "closed"}`, tx + 7, ty + 4);
  }

  if (on("motion")) for (const m of (d.motion_zones || [])) {
    const col = m.on ? "rgba(239,68,68," : "rgba(86,96,115,";
    ctx.lineWidth = 2;
    if (m.center) {
      const [cx, cy] = T(m.center);
      ctx.fillStyle = col + "0.12)"; ctx.strokeStyle = col + "0.8)";
      ctx.beginPath(); ctx.arc(cx, cy, m.radius * scale, 0, 7);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = col + "1)"; ctx.font = "11px system-ui";
      ctx.fillText(`${m.name} ${m.on ? "MOTION" : ""}`, cx + 6, cy - m.radius * scale - 4);
    } else {
      const [x0, y0] = T(m.min), [x1, y1] = T(m.max);
      ctx.fillStyle = col + "0.12)"; ctx.strokeStyle = col + "0.8)";
      ctx.fillRect(x0, y1, x1 - x0, y0 - y1);
      ctx.strokeRect(x0, y1, x1 - x0, y0 - y1);
      ctx.fillStyle = col + "1)"; ctx.font = "11px system-ui";
      ctx.fillText(`${m.name} ${m.on ? "MOTION" : ""}`, x0 + 4, y1 - 4);
    }
  }

  if (on("spots")) for (const s of (d.spots || [])) {
    const [px, py] = T(s.position);
    ctx.strokeStyle = "rgba(157,255,0,0.5)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(px, py, Math.max(s.radius * scale, 3), 0, 7); ctx.stroke();
    ctx.save(); ctx.translate(px, py); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = "#9dff00"; ctx.fillRect(-3, -3, 6, 6); ctx.restore();
    ctx.fillStyle = "#7da356"; ctx.font = "10px system-ui";
    ctx.fillText(s.name, px + 7, py - 5);
  }

  if (on("anchors")) for (const a of (d.anchors || [])) {
    const [px, py] = T(a.position);
    ctx.fillStyle = "#e8e8e8"; ctx.fillRect(px - 5, py - 5, 10, 10);
    ctx.fillStyle = "#14171c"; ctx.fillRect(px - 3, py - 3, 3, 3); ctx.fillRect(px, py, 3, 3);
    ctx.fillStyle = "#9aa3b2"; ctx.font = "10px system-ui";
    ctx.fillText(a.tag, px + 8, py + 4);
  }

  for (const c of d.cameras) {
    const [px, py] = T(c.position);
    ctx.save(); ctx.translate(px, py); ctx.rotate(-c.yaw_deg * Math.PI / 180);
    // unhealthy calibration (drifted camera) renders red
    const cal = c.calibration;
    ctx.fillStyle = cal && cal.healthy === false ? "#e05c5c" : "#c9a227";
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(14, -6); ctx.lineTo(14, 6); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  if (on("items")) for (const it of d.items) {
    if (!it.position) continue;
    const [px, py] = T(it.position);
    const stale = it.status === "stale";
    ctx.strokeStyle = stale ? "rgba(224,162,60,0.5)" : "rgba(78,161,255,0.6)";
    ctx.beginPath(); ctx.arc(px, py, Math.max(it.sigma_m * scale, 4), 0, 7); ctx.stroke();
    ctx.fillStyle = stale ? "#e0a23c" : itemColor(d, it.item_id);
    ctx.beginPath(); ctx.arc(px, py, 4, 0, 7); ctx.fill();
    ctx.font = "12px system-ui"; ctx.fillText(it.name, px + 8, py - 6);
  }
}

/* ---------- camera view ---------- */
function renderCamera(d) {
  const W = canvas.width, H = canvas.height;
  const P = pt => [pt[0] * W, pt[1] * H];

  if (on("heat")) for (const c of d.heat) {
    ctx.fillStyle = heatColor(c.v, 0.45);
    ctx.beginPath();
    c.q.forEach((pt, i) => { const [x, y] = P(pt); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath(); ctx.fill();
  }

  if (on("zones")) for (const z of d.zones) drawSeg(z.points, "#39414e", 1, P);
  if (on("rings")) for (const r of d.rings) drawSeg(r.points, "rgba(102,217,140,0.55)", 1.5, P);
  if (on("trails")) for (const tr of (d.trails || []))
    drawSeg(tr.points, "rgba(255,126,182,0.6)", 2, P);

  if (on("presence") && d.presence) {
    const [x, y] = P([d.presence.u, d.presence.v]);
    ctx.fillStyle = "rgba(138,125,255,0.3)";
    ctx.beginPath(); ctx.arc(x, y, 30, 0, 7); ctx.fill();
    ctx.fillStyle = "#8a7dff"; ctx.fillText("presence", x + 8, y);
  }

  if (on("people")) for (const p of (d.people || [])) {
    for (const seg of (p.trail || [])) drawSeg(seg, "rgba(255,92,138,0.6)", 2, P);
    if (p.u === undefined || p.u < 0 || p.u > 1 || p.v < 0 || p.v > 1) continue;
    const [x, y] = P([p.u, p.v]);
    ctx.strokeStyle = "#ff5c8a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.stroke();
    ctx.fillStyle = "#ffb3c9"; ctx.font = "13px system-ui";
    ctx.fillText(p.id, x + 10, y - 8);
  }

  if (on("items")) for (const it of d.items) {
    if (it.u < 0 || it.u > 1 || it.v < 0 || it.v > 1) continue;
    const [x, y] = P([it.u, it.v]);
    const stale = it.status === "stale";
    ctx.strokeStyle = stale ? "rgba(224,162,60,0.6)" : "rgba(78,161,255,0.7)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, Math.max(it.sigma_u * W, 6), 0, 7); ctx.stroke();
    ctx.fillStyle = stale ? "#e0a23c" : "#4ea1ff";
    ctx.font = "13px system-ui";
    ctx.fillText(`${it.name} (${it.age_s}s)`, x + 10, y - 8);
  }
}

function drawSeg(points, color, width, P) {
  ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.beginPath();
  points.forEach((pt, i) => { const [x, y] = P(pt); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
}

/* ---------- 3D view: overlays inside the Gaussian-splat scene ---------- */
let splat3d = null; // { THREE, group }

function setSplatVisible(show) {
  document.getElementById("splat-wrap").style.display = show ? "block" : "none";
  canvas.style.display = show ? "none" : "block";
  stream.style.display = "none";
  if (show && !splat3d) initSplat();
}

async function initSplat() {
  const wrap = document.getElementById("splat-wrap");
  wrap.textContent = "Loading 3D renderer…";
  try {
    // lazy-loaded from CDN; vendor these modules locally for offline use
    const THREE = await import("https://esm.sh/three@0.160.0");
    const scene = new THREE.Scene();
    const group = new THREE.Group();
    scene.add(group);
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));

    const b = worldBounds(state.data ? state.data.zones : []);
    const cx = (b.xmin + b.xmax) / 2, cy = (b.ymin + b.ymax) / 2;
    const span = Math.max(b.xmax - b.xmin, b.ymax - b.ymin, 6);
    const camPos = [cx, b.ymin - span * 0.4, span * 0.9];
    const lookAt = [cx, cy, 0.6];

    wrap.textContent = "";
    if (state.splat) {
      const GS = await import(
        "https://esm.sh/@mkkellogg/gaussian-splats-3d@0.4.7?deps=three@0.160.0"
      );
      const viewer = new GS.Viewer({
        rootElement: wrap,
        threeScene: scene,
        cameraUp: [0, 0, 1],
        initialCameraPosition: camPos,
        initialCameraLookAt: lookAt,
        sharedMemoryForWorkers: false,
      });
      const t = (state.data && state.data.splat_transform) || null;
      const opts = {};
      if (t) {
        if (t.position) opts.position = t.position;
        if (t.scale) opts.scale = [t.scale, t.scale, t.scale];
        if (t.rotation_deg) {
          const e = new THREE.Euler(...t.rotation_deg.map(x => x * Math.PI / 180));
          const q = new THREE.Quaternion().setFromEuler(e);
          opts.rotation = [q.x, q.y, q.z, q.w];
        }
      }
      await viewer.addSplatScene(assetUrl("/assets/splat"), opts);
      viewer.start();
    } else {
      // no scan configured: plain 3D world view with a ground grid
      const { OrbitControls } = await import(
        "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js?deps=three@0.160.0"
      );
      const grid = new THREE.GridHelper(span * 1.5, 30, 0x39414e, 0x262c35);
      grid.rotation.x = Math.PI / 2;
      grid.position.set(cx, cy, 0);
      scene.add(grid);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);
      wrap.appendChild(renderer.domElement);
      const cam = new THREE.PerspectiveCamera(60, wrap.clientWidth / wrap.clientHeight, 0.1, 200);
      cam.up.set(0, 0, 1);
      cam.position.set(...camPos);
      const controls = new OrbitControls(cam, renderer.domElement);
      controls.target.set(...lookAt);
      (function loop() {
        requestAnimationFrame(loop);
        controls.update();
        renderer.render(scene, cam);
      })();
    }
    splat3d = { THREE, group };
    if (state.data) update3D(state.data);
  } catch (e) {
    wrap.innerHTML = "<div style='padding:24px;color:#7d8696'>3D viewer unavailable " +
      "(renderer CDN unreachable or asset failed to load). The raw scan is served " +
      "at <code>/assets/splat</code>.</div>";
  }
}

function makeLabel(THREE, text, color) {
  const c = document.createElement("canvas");
  c.width = 256; c.height = 64;
  const g = c.getContext("2d");
  g.font = "32px system-ui"; g.fillStyle = color || "#d9dee7";
  g.shadowColor = "#000"; g.shadowBlur = 6;
  g.fillText(text, 8, 42);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), depthTest: false, transparent: true,
  }));
  sprite.scale.set(1.0, 0.25, 1);
  return sprite;
}

function line3(THREE, points, color, opacity = 1, dashed = false) {
  const geo = new THREE.BufferGeometry().setFromPoints(
    points.map(p => new THREE.Vector3(p[0], p[1], p[2] ?? 0)));
  const mat = dashed
    ? new THREE.LineDashedMaterial({ color, transparent: true, opacity, dashSize: 0.15, gapSize: 0.1 })
    : new THREE.LineBasicMaterial({ color, transparent: true, opacity });
  const line = new THREE.Line(geo, mat);
  if (dashed) line.computeLineDistances();
  return line;
}

let cloudPoints = null, cloudFetched = 0;
async function ensurePointCloud() {
  if (Date.now() - cloudFetched < 30000) return;  // refresh every 30 s
  cloudFetched = Date.now();
  try {
    const d = await (await authFetch("/pointcloud")).json();
    cloudPoints = d.points || [];
    if (state.view === "3d" && splat3d && state.data) update3D(state.data);
  } catch (e) { /* tracker restarting */ }
}

function heightColor(z, zmin, zmax) {
  const t = zmax <= zmin ? 0 : Math.max(0, Math.min(1, (z - zmin) / (zmax - zmin)));
  const stops = [[36,99,235],[34,211,238],[74,222,128],[250,204,21],[236,72,153]];
  const f = t * (stops.length - 1), i = Math.min(Math.floor(f), stops.length - 2), u = f - i;
  return stops[i].map((a, k) => (a + (stops[i+1][k] - a) * u) / 255);
}

function update3D(d) {
  if (!splat3d) return;
  const { THREE, group } = splat3d;
  for (const child of [...group.children]) {
    group.remove(child);
    child.traverse?.(o => { o.geometry?.dispose(); o.material?.map?.dispose(); o.material?.dispose(); });
  }

  if (on("zones")) for (const z of d.zones) {
    const size = [0, 1, 2].map(i => z.max[i] - z.min[i]);
    const box = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(...size)),
      new THREE.LineBasicMaterial({ color: 0x39414e, transparent: true, opacity: 0.7 }));
    box.position.set(...[0, 1, 2].map(i => (z.min[i] + z.max[i]) / 2));
    group.add(box);
  }

  if (on("heat")) for (const h of d.heatmaps) {
    if (!h.values) continue;
    const verts = [], colors = [], cell = h.cell_m, z = h.height_m;
    const col = new THREE.Color();
    for (let iy = 0; iy < h.values.length; iy++)
      for (let ix = 0; ix < h.values[iy].length; ix++) {
        const v = h.values[iy][ix];
        if (v < 0.05) continue;
        const x0 = h.bounds[0] + ix * cell, y0 = h.bounds[1] + iy * cell;
        col.setHSL((240 - 240 * v) / 360, 0.9, 0.55);
        const quad = [[x0, y0], [x0 + cell, y0], [x0 + cell, y0 + cell], [x0, y0 + cell]];
        for (const idx of [0, 1, 2, 0, 2, 3]) {
          verts.push(quad[idx][0], quad[idx][1], z);
          colors.push(col.r, col.g, col.b);
        }
      }
    if (verts.length) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
      geo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      group.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
        vertexColors: true, transparent: true, opacity: 0.35, side: THREE.DoubleSide,
        depthWrite: false,
      })));
    }
  }

  if (on("rings")) for (const r of d.rings) {
    const pts = [];
    for (let i = 0; i <= 36; i++) {
      const a = i / 36 * 2 * Math.PI;
      pts.push([r.cx + r.radius * Math.cos(a), r.cy + r.radius * Math.sin(a), r.z]);
    }
    group.add(line3(THREE, pts, 0x66d98c, 0.45));
  }

  if (on("bearings")) for (const b of (d.bearings || [])) {
    const end = [0, 1, 2].map(i => b.origin[i] + b.direction[i] * b.length_m);
    group.add(line3(THREE, [b.origin, end], 0xc9a227, 0.6, true));
  }

  if (on("trails")) for (const tr of (d.trails || [])) {
    group.add(line3(THREE, tr.points, new THREE.Color(itemColor(d, tr.item_id)).getHex(), 0.7));
  }

  if (on("presence") && d.presence) {
    const s = new THREE.Mesh(
      new THREE.SphereGeometry(Math.min(d.presence.sigma_m, 1.5), 16, 12),
      new THREE.MeshBasicMaterial({ color: 0x8a7dff, transparent: true, opacity: 0.18 }));
    s.position.set(...d.presence.centroid);
    group.add(s);
  }

  if (on("worldmodel") && cloudPoints && cloudPoints.length) {
    // the apartment as a lidar-style cloud: height-ramped colors
    const zs = cloudPoints.map(p => p[2]);
    const zmin = Math.min(...zs), zmax = Math.max(...zs);
    const pos = new Float32Array(cloudPoints.length * 3);
    const col = new Float32Array(cloudPoints.length * 3);
    cloudPoints.forEach((p, i) => {
      pos.set([p[0], p[1], p[2]], i * 3);
      col.set(heightColor(p[2], zmin, zmax), i * 3);
    });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    group.add(new THREE.Points(geo, new THREE.PointsMaterial({
      size: 0.06, vertexColors: true, transparent: true, opacity: 0.8,
      sizeAttenuation: true })));
  }

  if (on("movables")) for (const m of (d.movables || [])) {
    group.add(line3(THREE, m.path, 0x39414e, 0.9));
    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.05, 12, 8),
      new THREE.MeshBasicMaterial({ color: m.is_open ? 0x9dff00 : 0x566073 }));
    dot.position.set(...m.tag_pos);
    group.add(dot);
  }

  if (on("spots")) for (const s of (d.spots || [])) {
    const oct = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.06),
      new THREE.MeshBasicMaterial({ color: 0x9dff00 }));
    oct.position.set(...s.position);
    group.add(oct);
    const label = makeLabel(THREE, s.name, "#7da356");
    label.position.set(s.position[0], s.position[1], s.position[2] + 0.15);
    group.add(label);
  }

  if (on("anchors")) for (const a of (d.anchors || [])) {
    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, 0.08, 0.08),
      new THREE.MeshBasicMaterial({ color: 0xe8e8e8 }));
    cube.position.set(...a.position);
    group.add(cube);
    const label = makeLabel(THREE, a.tag, "#9aa3b2");
    label.position.set(a.position[0], a.position[1], a.position[2] + 0.18);
    group.add(label);
  }

  for (const c of d.cameras) {
    const cal = c.calibration;
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(0.1, 0.3, 12),
      new THREE.MeshBasicMaterial({
        color: cal && cal.healthy === false ? 0xe05c5c : 0xc9a227 }));
    cone.position.set(...c.position);
    // ConeGeometry's tip points +y; rotate about z so it aims along yaw
    cone.rotation.z = (c.yaw_deg * Math.PI / 180) - Math.PI / 2;
    group.add(cone);
  }

  if (on("items")) for (const it of d.items) {
    if (!it.position) continue;
    const stale = it.status === "stale";
    const color = stale ? 0xe0a23c : new THREE.Color(itemColor(d, it.item_id)).getHex();
    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.07, 16, 12),
      new THREE.MeshBasicMaterial({ color }));
    dot.position.set(...it.position);
    group.add(dot);
    const sigma = new THREE.Mesh(
      new THREE.SphereGeometry(Math.min(Math.max(it.sigma_m, 0.05), 1.2), 16, 12),
      new THREE.MeshBasicMaterial({ color, wireframe: true, transparent: true, opacity: 0.25 }));
    sigma.position.set(...it.position);
    group.add(sigma);
    const label = makeLabel(THREE, it.name, stale ? "#e0a23c" : "#d9dee7");
    label.position.set(it.position[0], it.position[1], it.position[2] + 0.3);
    group.add(label);
  }
}

/* ---------- side panel ---------- */
function renderPanel(items, events) {
  const list = document.getElementById("item-list");
  list.innerHTML = "";
  for (const it of items) {
    const row = document.createElement("div");
    row.className = "item-row";
    const name = document.createElement("span");
    name.textContent = it.name;
    const where = document.createElement("span");
    if (it.status === "never_seen") {
      const n = document.createElement("span");
      n.className = "never"; n.textContent = "never seen";
      where.append(n);
    } else if (it.maybe_carried_by) {
      const place = document.createElement("span");
      place.className = "zone-name";
      place.textContent = `carried by ${it.maybe_carried_by} → ${it.likely_zone || "?"}`;
      where.append(place);
    } else {
      const place = document.createElement("span");
      place.className = "zone-name";
      place.textContent = it.maybe_in ? `likely in ${it.maybe_in}` : (it.spot || it.zone || "unzoned");
      const age = document.createElement("span");
      age.className = it.status === "stale" ? "stale" : "";
      age.textContent = `${it.age_s}s`;
      where.append(place, ` ±${it.sigma_m}m `, age);
    }
    row.append(name, where);
    list.append(row);
  }
  const ev = document.getElementById("event-list");
  ev.innerHTML = "";
  for (const e of [...events].reverse()) {
    const div = document.createElement("div");
    div.className = "ev";
    div.textContent = e.event
      ? `${e.movable}: ${e.event}`
      : `${e.item_id}: ${e.from_spot || e.from_zone || "?"} → ${e.to_spot || e.to_zone || "?"}`;
    ev.append(div);
  }
}

/* ---------- main loop ---------- */
function render() {
  if (!state.data || state.view === "3d") return;
  const wrap = document.getElementById("view-wrap");
  canvas.width = wrap.clientWidth; canvas.height = wrap.clientHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (state.view === "map") renderMap(state.data);
  else renderCamera(state.data);
}

async function tick() {
  try {
    const want3d = state.view === "3d";
    const url = (state.view === "map" || want3d)
      ? "/overlay/map" : `/overlay/camera/${state.view}`;
    const d = await (await authFetch(url)).json();
    state.data = d;
    if (state.view === "map" || want3d) {
      const cams = d.cameras.map(c => c.sensor_id);
      if (JSON.stringify(cams) !== JSON.stringify(state.cameras) || d.splat !== state.splat) {
        state.cameras = cams; state.splat = d.splat; buildTabs();
      }
      if (d.splat_version !== state.splatVersion) {
        // scan hot-swapped (weekly rebuild): rebuild the 3D viewer lazily
        state.splatVersion = d.splat_version;
        if (splat3d) {
          splat3d = null;
          document.getElementById("splat-wrap").innerHTML = "";
          if (want3d) initSplat();
        }
      }
      renderPanel(d.items, d.events);
      if (want3d) { ensurePointCloud(); if (splat3d) update3D(d); return; }
      stream.style.display = "none";
      // drop the MJPEG connection (each open stream holds a server thread)
      if (stream.dataset.src) { delete stream.dataset.src; stream.removeAttribute("src"); }
    } else {
      // external stream if configured, else the tracker's own MJPEG of
      // captured frames; set src only on change — re-assigning reconnects
      const want = d.stream_url
        || assetUrl(`/camera/${encodeURIComponent(state.view)}/stream.mjpg`);
      if (stream.dataset.src !== want) { stream.dataset.src = want; stream.src = want; }
      stream.style.display = "block";
      const map = await (await authFetch("/overlay/map")).json();
      renderPanel(map.items, map.events);
    }
    render();
  } catch (e) { /* tracker restarting; retry next tick */ }
}

// shift-drag on the map draws a new motion-sensor zone
let dragStart = null;
function canvasToWorld(ev) {
  const rect = canvas.getBoundingClientRect();
  const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
  const T = mapTransform(state.data);
  const [ox, oy, s] = T([0, 0]);
  return [(px - ox) / s, (oy - py) / s];
}
canvas.addEventListener("mousedown", (ev) => {
  if (ev.shiftKey && state.view === "map" && state.data) dragStart = canvasToWorld(ev);
});
canvas.addEventListener("mouseup", async (ev) => {
  if (!dragStart) return;
  const a = dragStart, b = canvasToWorld(ev);
  dragStart = null;
  if (Math.abs(a[0] - b[0]) < 0.1 || Math.abs(a[1] - b[1]) < 0.1) return;
  const name = prompt("Motion zone name (becomes a Home Assistant device):");
  if (!name) return;
  await fetch("/motion-zones", {
    method: "POST",
    headers: { "Content-Type": "application/json", ...authHeaders() },
    body: JSON.stringify({
      name,
      min: [Math.min(a[0], b[0]), Math.min(a[1], b[1]), 0.0],
      max: [Math.max(a[0], b[0]), Math.max(a[1], b[1]), 2.6],
    }),
  });
  tick();
});

canvas.addEventListener("click", (ev) => {
  if (state.view !== "map" || !state.data) return;
  const rect = canvas.getBoundingClientRect();
  const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
  const T = mapTransform(state.data);
  const [ox, oy, s] = T([0, 0]);
  const wx = (px - ox) / s, wy = (oy - py) / s;
  const text = `[${wx.toFixed(2)}, ${wy.toFixed(2)}, 0.0]`;
  navigator.clipboard?.writeText(text).catch(() => {});
  ctx.fillStyle = "#ffd400"; ctx.font = "12px ui-monospace, monospace";
  ctx.fillText(`world ${text} (copied)`, px + 10, py - 8);
});

buildLayerToggles();
buildTabs();
tick();
/* ---------- settings: camera capture modes + system lifecycle ---------- */
const settings = document.getElementById("settings");
document.getElementById("gear").onclick = () => {
  settings.style.display = "flex"; sMsg(""); loadCamConfig();
};
settings.addEventListener("click", (e) => {
  if (e.target === settings) settings.style.display = "none";
});
function sMsg(t) { document.getElementById("settings-msg").textContent = t; }

async function loadCamConfig() {
  const el = document.getElementById("cam-config");
  el.textContent = "loading…";
  let cams;
  try { cams = await (await authFetch("/config/cameras")).json(); }
  catch (e) { el.textContent = "config unavailable"; return; }
  el.innerHTML = "";
  if (!cams.length) el.textContent = "no cameras configured";
  for (const c of cams) {
    const cap = c.capture || {}, n = cap.negotiated || {}, req = cap.requested || {};
    const row = document.createElement("div");
    row.className = "cam-cfg";
    row.innerHTML = `<b>${c.sensor_id}</b>
      <div class="now">delivering ${n.width ?? "?"}x${n.height ?? "?"} @ ${n.fps ?? "?"} fps`
      + ` (${n.fourcc || "default format"}, ${n.backend || "?"})</div>
      <div class="fields">
        <label>device<input name="device" value="${cap.device ?? 0}"></label>
        <label>width<input name="width" value="${req.width ?? n.width ?? ""}"></label>
        <label>height<input name="height" value="${req.height ?? n.height ?? ""}"></label>
        <label>fps<input name="fps" value="${req.fps ?? n.fps ?? ""}"></label>
        <label>format<select name="fourcc">
          <option value="MJPG">MJPG</option><option value="YUY2">YUY2</option>
          <option value="">default</option></select></label>
        <button>Apply</button>
      </div>`;
    row.querySelector("select").value = req.fourcc ?? "MJPG";
    row.querySelector("button").onclick = async () => {
      const body = {};
      for (const f of row.querySelectorAll("input, select")) body[f.name] = f.value;
      sMsg("applying — the camera re-opens, give it a second…");
      try {
        const r = await fetch(`/config/cameras/${encodeURIComponent(c.sensor_id)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json", ...authHeaders() },
          body: JSON.stringify(body),
        });
        const out = await r.json();
        if (!r.ok) { sMsg(out.error || "failed"); return; }
        const got = out.capture.negotiated;
        sMsg(`camera negotiated ${got.width}x${got.height} @ ${got.fps} fps — saved`);
        loadCamConfig();
      } catch (e) { sMsg("no response from tracker"); }
    };
    el.appendChild(row);
  }
}

async function sysAction(action, confirmText) {
  if (!confirm(confirmText)) return;
  sMsg(action + "…");
  try {
    const r = await fetch(`/system/${action}`, { method: "POST", headers: authHeaders() });
    const out = await r.json();
    if (!r.ok) { sMsg(out.error || "failed"); return; }
    sMsg(action === "shutdown"
      ? "tracker stopped — relaunch HomeTwin to start it again"
      : "restarting — the page reconnects automatically");
  } catch (e) { sMsg("no response — tracker may already be down"); }
}
document.getElementById("sys-restart").onclick = () =>
  sysAction("restart", "Restart the tracker? State is saved first.");
document.getElementById("sys-update").onclick = () =>
  sysAction("update", "Install the latest code from the update channel and restart?");
document.getElementById("sys-shutdown").onclick = () =>
  sysAction("shutdown", "Shut the tracker down? Relaunch HomeTwin to start it again.");

setInterval(tick, 1000);
window.addEventListener("resize", render);
</script>
</body>
</html>
